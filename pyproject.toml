[project]
name = "sd-sma-runtime"
version = "1.0.0"
description = "Independent SD SMA launcher runtime"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy==2.0.25",
    "pymysql==1.1.0",
    "python-multipart==0.0.9",
    "opcua==0.98.13",
    "asyncua>=2,<3",
    "psutil>=5.9,<8",
    "cryptography",
]

[tool.uv]
package = false
