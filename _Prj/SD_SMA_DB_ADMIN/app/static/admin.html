<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="dbAdmin.markup.title1"></title>
    <link rel="stylesheet" href="/common/base.css?v=20261020_03" />
    <link rel="stylesheet" href="/static/styles.css?v=20261029_02" />
  </head>
  <body>
    <nav class="page-nav" aria-label="" data-i18n-aria="dbAdmin.aria.label82">
      <span class="page-nav-current" data-i18n="dbAdmin.markup.span1"></span>
      <span class="page-nav-sep">|</span>
      <a href="/config" data-i18n="dbConfig.nav.title">数据库配置</a>
    </nav>

    <div id="appStatusBar" class="app-status-bar" role="status" aria-live="polite" aria-atomic="true" hidden></div>

    <div class="layout layout-stack">
      <section class="panel">
        <h2 data-i18n="dbAdmin.markup.h21"></h2>
        <p class="hint" data-i18n="dbAdmin.markup.p1"></p>
        <div class="row">
          <label for="databaseSelect" data-i18n="dbAdmin.markup.databaseSelect"></label>
          <select id="databaseSelect"></select>
          <button type="button" id="btnLoadDatabases" data-i18n="dbConfig.actions.reload">读取数据库</button>
          <button type="button" id="btnRefreshTables" data-i18n="dbAdmin.markup.btnRefreshTables"></button>
          <label for="tableSelect" data-i18n="dbAdmin.markup.tableSelect"></label>
          <select id="tableSelect"></select>
        </div>
        <div class="row">
          <button type="button" id="btnBackupSql" data-i18n="dbAdmin.markup.btnBackupSql"></button>
          <button type="button" id="btnBackupTableSql" data-i18n="dbAdmin.markup.btnBackupTableSql"></button>
          <button type="button" id="btnExportCsv" data-i18n="dbAdmin.markup.btnExportCsv"></button>
        </div>
        <div id="objectHint" class="muted"></div>
        <div id="backupHint" class="muted"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="dbAdmin.markup.h22"></h2>
        <p class="hint" data-i18n="dbAdmin.markup.p2"></p>

        <div class="op-block">
          <h3 class="op-block-title" data-i18n="dbAdmin.markup.h31"></h3>
          <p class="hint op-block-hint" data-i18n="dbAdmin.markup.p3"></p>
          <div class="row">
            <label for="serverBackupSelect" data-i18n="dbAdmin.markup.serverBackupSelect"></label>
            <select id="serverBackupSelect"></select>
            <button type="button" id="btnRefreshBackups" data-i18n="dbAdmin.markup.btnRefreshBackups"></button>
            <button type="button" id="btnRegisterSql" data-i18n="dbAdmin.markup.btnRegisterSql"></button>
          </div>
          <div class="row">
            <label for="restoreDatabaseSelect" data-i18n="dbAdmin.markup.restoreDatabaseSelect"></label>
            <select id="restoreDatabaseSelect"></select>
            <button type="button" id="btnRestoreServerBackup" class="danger-btn" data-i18n="dbAdmin.markup.btnRestoreServerBackup"></button>
          </div>

        </div>

        <div class="op-block op-block-secondary">
          <h3 class="op-block-title" data-i18n="dbAdmin.markup.h32"></h3>
          <p class="hint op-block-hint" data-i18n="dbAdmin.markup.p4"></p>
          <div class="row">
            <label for="serverCsvSelect" data-i18n="dbAdmin.markup.serverCsvSelect"></label>
            <select id="serverCsvSelect"></select>
            <button type="button" id="btnRefreshCsvExports" data-i18n="dbAdmin.markup.btnRefreshCsvExports"></button>
            <button type="button" id="btnRegisterCsv" data-i18n="dbAdmin.markup.btnRegisterCsv"></button>
          </div>
          <div class="row">
            <label for="importDatabaseSelect" data-i18n="dbAdmin.markup.importDatabaseSelect"></label>
            <select id="importDatabaseSelect"></select>
            <button type="button" id="btnRefreshImportTables" data-i18n="dbAdmin.markup.btnRefreshImportTables"></button>
            <label for="importTableSelect" data-i18n="dbAdmin.markup.importTableSelect"></label>
            <select id="importTableSelect"></select>
          </div>
          <div class="row">
            <label for="forceCsvImport" data-i18n="dbAdmin.markup.forceCsvImport"></label>
            <input id="forceCsvImport" type="checkbox" />
            <label for="truncateBeforeImport" data-i18n="dbAdmin.markup.truncateBeforeImport"></label>
            <input id="truncateBeforeImport" type="checkbox" />
            <button type="button" id="btnImportServerCsv" class="danger-btn" data-i18n="dbAdmin.markup.btnImportServerCsv"></button>
          </div>
        </div>

        <div id="importHint" class="muted warn"></div>
      </section>

      <section class="panel backup-manager-panel">
        <div class="panel-heading">
          <div>
            <h2 data-i18n="dbAdmin.markup.h23"></h2>
            <p class="hint" data-i18n="dbAdmin.markup.p5"></p>
          </div>
          <span class="touch-badge" data-i18n="dbAdmin.markup.span2"></span>
        </div>
        <div class="backup-manager-grid">
          <div class="backup-browser-pane">
            <div class="backup-browser-toolbar">
              <button type="button" id="btnBackupFilesRoots" data-i18n="dbAdmin.markup.btnBackupFilesRoots"></button>
              <button type="button" id="btnBackupFilesParent" data-i18n="dbAdmin.markup.btnBackupFilesParent"></button>
              <button type="button" id="btnRefreshBackupFiles" data-i18n="dbAdmin.markup.btnRefreshBackupFiles"></button>
              <button type="button" id="btnSelectCurrentBackupFiles" data-i18n="dbAdmin.markup.btnSelectCurrentBackupFiles"></button>
            </div>
            <div id="backupFilesPath" class="filesystem-path" data-i18n="dbAdmin.markup.backupFilesPath"></div>
            <div id="backupFilesList" class="backup-files-list" role="group" aria-label="" data-i18n-aria="dbAdmin.aria.label83"></div>
          </div>
          <aside class="backup-actions-pane">
            <div class="backup-selection-heading">
              <h3 data-i18n="dbAdmin.markup.h33"></h3>
              <button type="button" id="btnClearBackupSelection" data-i18n="dbAdmin.markup.btnClearBackupSelection"></button>
            </div>
            <div id="backupSelectionSummary" class="backup-selection-summary"></div>
            <div id="backupSelectedFiles" class="backup-selected-files"></div>

            <div class="backup-action-block">
              <h3 data-i18n="dbAdmin.markup.h34"></h3>
              <label for="backupCopyDestination" data-i18n="dbAdmin.markup.backupCopyDestination"></label>
              <input id="backupCopyDestination" type="text" readonly placeholder="" data-i18n-placeholder="dbAdmin.placeholder.label84" />
              <div class="backup-action-buttons">
                <button type="button" id="btnChooseBackupDestination" data-i18n="dbAdmin.markup.btnChooseBackupDestination"></button>
                <button type="button" id="btnRefreshRemovableDrives" data-i18n="dbAdmin.markup.btnRefreshRemovableDrives"></button>
                <button type="button" id="btnCopyBackups" class="primary-btn" data-i18n="dbAdmin.markup.btnCopyBackups"></button>
              </div>
            </div>

            <div class="backup-action-block backup-delete-block">
              <h3 data-i18n="dbAdmin.markup.h35"></h3>
              <p class="hint warn" data-i18n="dbAdmin.markup.p6"></p>
              <button type="button" id="btnDeleteBackupFiles" class="danger-btn" data-i18n="dbAdmin.markup.btnDeleteBackupFiles"></button>
            </div>
            <div id="backupManagerHint" class="muted"></div>
          </aside>
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="dbAdmin.markup.h24"></h2>
        <div class="row">
          <button type="button" id="btnRefreshJobs" data-i18n="dbAdmin.markup.btnRefreshJobs"></button>
          <span id="jobSummary" class="muted"></span>
        </div>
        <div class="jobs-grid">
          <table id="jobsTable"></table>
          <textarea id="jobLog" readonly aria-label="" data-i18n-aria="dbAdmin.aria.label85"></textarea>
        </div>
      </section>
    </div>

    <div id="confirm-modal-overlay" class="modal-overlay" style="display: none">
      <div class="modal-dialog">
        <h3 id="confirm-modal-title" class="modal-title" data-i18n="dbAdmin.markup.confirm-modal-title"></h3>
        <p id="confirm-modal-message" class="hint"></p>
        <div class="modal-footer">
          <button id="confirm-modal-cancel" type="button" data-i18n="dbAdmin.markup.confirm-modal-cancel"></button>
          <button id="confirm-modal-confirm" type="button" class="danger-btn" data-i18n="dbAdmin.markup.confirm-modal-confirm"></button>
        </div>
      </div>
    </div>

    <div id="filesystem-modal-overlay" class="modal-overlay" style="display: none">
      <div class="modal-dialog filesystem-dialog">
        <h3 id="filesystem-modal-title" class="modal-title" data-i18n="dbAdmin.markup.filesystem-modal-title"></h3>
        <div id="filesystem-modal-path" class="filesystem-path"></div>
        <div id="filesystem-modal-list" class="filesystem-list"></div>
        <div class="modal-footer">
          <button id="filesystem-modal-refresh" type="button" style="display: none" data-i18n="dbAdmin.markup.filesystem-modal-refresh"></button>
          <button id="filesystem-modal-cancel" type="button" data-i18n="dbAdmin.markup.filesystem-modal-cancel"></button>
          <button id="filesystem-modal-select" type="button" data-i18n="dbAdmin.markup.filesystem-modal-select"></button>
        </div>
      </div>
    </div>

    <script src="/common/zh.js?v=20261029_02"></script>
    <script src="/common/i18n.js?v=20261020_03"></script>
    <script src="/static/filesystem.js?v=20261029_02"></script>
    <script src="/static/admin.js?v=20261029_02"></script>
  </body>
</html>
