<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="dbConfig.nav.title"></title>
    <link rel="stylesheet" href="/common/base.css?v=20261020_03" />
    <link rel="stylesheet" href="/static/styles.css?v=20261029_02" />
  </head>
  <body>
    <nav class="page-nav" data-i18n-aria="dbConfig.nav.label">
      <a href="/admin" data-i18n="dbConfig.nav.admin"></a>
      <span class="page-nav-sep">|</span>
      <span class="page-nav-current" data-i18n="dbConfig.nav.title"></span>
    </nav>
    <main class="layout layout-stack">
      <section id="managedStoragePanel" class="panel" hidden>
        <h2 data-i18n="dbStorage.panel.title"></h2>
        <p class="hint" data-i18n="dbStorage.panel.hint"></p>
        <p id="managedStorageStatus" role="status" aria-live="polite"></p>
        <p id="managedStorageDetails" class="muted"></p>
        <button id="refreshManagedStorage" type="button" data-i18n="dbStorage.panel.refresh"></button>
      </section>
      <section id="connectionPanel" class="panel connection-panel">
        <h2 data-i18n="dbConfig.form.title"></h2>
        <p class="hint" data-i18n="dbConfig.form.hint"></p>
        <form id="connectionForm">
          <fieldset id="connectionFields" class="connection-form">
            <div class="field-block">
              <label for="dbHost" data-i18n="dbConfig.form.host"></label>
              <input id="dbHost" name="host" required value="127.0.0.1" autocomplete="off" />
            </div>
            <div class="field-block field-port">
              <label for="dbPort" data-i18n="dbConfig.form.port"></label>
              <input id="dbPort" name="port" type="number" required min="1" max="65535" value="3306" />
            </div>
            <div class="field-block">
              <label for="dbUsername" data-i18n="dbConfig.form.username"></label>
              <input id="dbUsername" name="username" required autocomplete="username" />
            </div>
            <div class="field-block field-password">
              <label for="dbPassword" data-i18n="dbConfig.form.password"></label>
              <div class="password-control">
                <input id="dbPassword" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="dbConfig.form.passwordHint" />
                <button type="button" id="btnTogglePassword" data-i18n="dbConfig.actions.show" data-i18n-aria="dbConfig.actions.show"></button>
                <button type="button" id="btnClearPassword" data-i18n="dbConfig.actions.clear"></button>
              </div>
            </div>
          </fieldset>
          <div class="connection-actions">
            <button type="button" id="btnTestConnection" data-i18n="dbConfig.actions.test"></button>
            <button type="submit" id="btnSaveConnection" data-i18n="dbConfig.actions.save"></button>
          </div>
        </form>
        <p id="connectionHint" class="muted" role="status" aria-live="polite"></p>
      </section>
      <section class="panel">
        <h2 data-i18n="dbConfig.output.title"></h2>
        <p class="hint" data-i18n="dbConfig.output.hint"></p>
        <form id="outputForm">
          <div class="row">
            <label for="outputDir" data-i18n="dbConfig.output.directory"></label>
            <input id="outputDir" name="output_dir" type="text" required />
            <button type="button" id="btnChooseOutputDir" data-i18n="dbConfig.output.browse"></button>
            <button type="button" id="btnUseDefaultOutputDir" data-i18n="dbConfig.output.default"></button>
          </div>
          <button type="submit" id="btnSaveOutputDir" data-i18n="dbConfig.output.save"></button>
        </form>
        <p id="outputHint" class="muted" role="status" aria-live="polite"></p>
      </section>
    </main>
    <div id="filesystem-modal-overlay" class="modal-overlay" style="display: none">
      <div class="modal-dialog filesystem-dialog">
        <h3 id="filesystem-modal-title" class="modal-title" data-i18n="dbAdmin.markup.filesystem-modal-title"></h3>
        <div id="filesystem-modal-path" class="filesystem-path"></div>
        <div id="filesystem-modal-list" class="filesystem-list"></div>
        <div class="modal-footer">
          <button id="filesystem-modal-refresh" type="button" style="display: none" data-i18n="dbAdmin.markup.filesystem-modal-refresh"></button>
          <button id="filesystem-modal-cancel" type="button" data-i18n="dbAdmin.markup.filesystem-modal-cancel"></button>
          <button id="filesystem-modal-select" type="button" data-i18n="dbAdmin.markup.filesystem-modal-select"></button>
        </div>
      </div>
    </div>

    <script src="/common/zh.js?v=20261104_01"></script>
    <script src="/common/i18n.js?v=20261020_03"></script>
    <script src="/static/filesystem.js?v=20261029_02"></script>
    <script src="/static/config.js?v=20261104_01"></script>
    <script src="/static/storage.js?v=20261104_01"></script>
  </body>
</html>
