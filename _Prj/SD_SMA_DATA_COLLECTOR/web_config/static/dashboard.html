<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>采集监视 — SD SMA</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <nav class="page-nav" aria-label="站内导航">
      <span class="page-nav-current">采集监视</span>
      <span class="page-nav-sep" aria-hidden="true">·</span>
      <a href="/config">配置与 OPC UA</a>
    </nav>
    <div class="layout">
      <section class="panel panel-span">
        <h2>采集监视</h2>
        <p class="hint">
          仅在此处点击「启动采集」后才会开始 data_collector。关闭本窗口即结束 Web 服务与托管的采集任务。
        </p>
        <div class="row row-monitor">
          <span class="inline-label">配置文件</span>
          <select id="monitor-config-select"></select>
          <button type="button" id="btn-collector-start">启动采集</button>
          <button type="button" id="btn-collector-stop" class="danger-btn">停止采集</button>
        </div>
        <div class="startup-settings">
          <label class="startup-toggle">
            <input id="startup-auto-enabled" type="checkbox" />
            <span>启动 Web 后自动启动采集</span>
          </label>
          <label class="startup-delay">
            <span>延迟秒数</span>
            <input id="startup-delay-seconds" type="number" min="0" max="300" value="3" />
          </label>
          <button type="button" id="btn-save-startup-settings">保存启动设置</button>
          <span id="startup-settings-hint" class="muted"></span>
        </div>
        <div id="monitor-status" class="monitor-status">加载状态…</div>
        <h3 class="subheading">运行日志（与文件/控制台同源）</h3>
        <div class="row">
          <button type="button" id="btn-log-pause">暂停日志</button>
        </div>
        <pre id="monitor-log" class="monitor-log"></pre>
      </section>
    </div>
    <script src="/static/dashboard.js?v=20260528_1"></script>
  </body>
</html>
