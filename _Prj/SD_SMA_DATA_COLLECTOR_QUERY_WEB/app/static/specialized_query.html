<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpecializedQuery</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #ffffff;
    }
    .root {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px;
      gap: 8px;
    }
    .toolbar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }
    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 34px;
    }
    .toolbar-row .spacer {
      flex: 1 1 auto;
    }
    .toolbar input, .toolbar select, .toolbar button, .pager input, .pager button {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      background: #fff;
      height: 32px;
      box-sizing: border-box;
      touch-action: manipulation;
    }
    .toolbar-row label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .toolbar input[type="radio"] {
      width: 20px;
      height: 20px;
      padding: 0;
    }
    .toolbar button {
      cursor: pointer;
    }
    .toolbar button, .pager button {
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.06s ease;
    }
    .toolbar button:hover, .pager button:hover {
      background: #f3f4f6;
    }
    .toolbar button:active, .pager button:active {
      background: #e5e7eb;
      border-color: #9ca3af;
      transform: translateY(1px);
    }
    .toolbar button.is-clicked, .pager button.is-clicked {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1d4ed8;
    }
    .toolbar button.active {
      background: #2563eb;
      border-color: #1d4ed8;
      color: #fff;
    }
    .meta {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tableWrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 6px;
      text-align: left;
    }
    th {
      position: sticky;
      top: 0;
      background: #f9fafb;
      z-index: 1;
    }
    tbody tr {
      cursor: pointer;
    }
    tbody tr.row-selected td {
      background: #dbeafe;
    }
    .pager {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 34px;
    }
    .pageInput {
      width: 68px;
      text-align: center;
    }
    .pageText {
      font-size: 12px;
      color: #374151;
      white-space: nowrap;
    }
    .pageTotal,
    .recordSummary {
      font-weight: 600;
      color: #1f2937;
    }
    #tableSelector {
      min-width: 220px;
    }
    .query-head {
      display: grid;
      grid-template-columns: auto minmax(168px, 220px) minmax(0, 1fr) 76px;
      grid-template-areas:
        "start-label start-value presets export"
        "end-label end-value fuzzy export";
      gap: 6px 8px;
      align-items: center;
    }
    .query-head .time-label,
    .query-head .time-display {
      height: 32px;
      box-sizing: border-box;
    }
    .query-head .time-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 72px;
      padding: 0 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      white-space: nowrap;
    }
    .query-head .time-label-start { grid-area: start-label; }
    .query-head .time-label-end { grid-area: end-label; }
    .query-head .time-display {
      width: 100%;
      text-align: center;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }
    .query-head .time-display.is-empty {
      color: #9ca3af;
    }
    .query-head #startTimeDisplay { grid-area: start-value; }
    .query-head #endTimeDisplay { grid-area: end-value; }
    .preset-row {
      grid-area: presets;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .preset-row button {
      flex: 1 1 0;
      min-width: 0;
    }
    .filter-row {
      grid-area: fuzzy;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .filter-row label {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .filter-row select {
      flex: 1 1 0;
      min-width: 0;
      width: auto;
    }
    .filter-row button {
      flex: 0 0 auto;
    }
    .export-slot {
      grid-area: export;
      align-self: stretch;
    }
    .touch-time-anchor {
      display: none;
    }
    @media (pointer: coarse), (max-width: 900px) {
      .root {
        padding: 8px;
        gap: 10px;
      }
      .toolbar {
        gap: 8px;
      }
      .toolbar-row,
      .pager {
        gap: 10px 8px;
        min-height: 44px;
      }
      .toolbar-row > span,
      .toolbar-row label,
      .pageText {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        font-size: 14px;
      }
      .toolbar input:not([type="radio"]),
      .toolbar select,
      .toolbar button,
      .pager input,
      .pager button {
        height: 44px;
        min-height: 44px;
        padding: 9px 12px;
        font-size: 16px;
      }
      .toolbar input[type="radio"] {
        width: 24px;
        height: 24px;
      }
      .toolbar select {
        flex: 1 1 190px;
        min-width: 160px;
      }
      .toolbar button,
      .pager button {
        min-width: 96px;
      }
      .query-head .preset-row button,
      .query-head .time-display,
      .query-head .filter-row button,
      .query-head .filter-row select {
        min-width: 0;
        flex: 1 1 0;
      }
      .query-head .filter-row button,
      .query-head .filter-row label {
        flex: 0 0 auto;
      }
      .pager button {
        flex: 1 1 120px;
      }
      th, td {
        padding: 10px 8px;
        font-size: 14px;
      }
      tbody tr {
        min-height: 44px;
      }
      .meta {
        flex: 1 1 100%;
        font-size: 13px;
      }
    }
    @media (max-width: 900px) {
      .query-head {
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-areas:
          "start-label start-value"
          "presets presets"
          "end-label end-value"
          "fuzzy fuzzy";
      }
      .export-slot {
        display: none;
      }
      .query-head .preset-row button {
        flex: 1 1 auto;
        padding: 8px 6px;
        font-size: 14px;
      }
    }
  </style>
  <link rel="stylesheet" href="/static/touch_time_range.css?v=20260727_02" />
</head>
<body>
  <div id="app" class="root">
    <div class="toolbar">
      <div id="pluginTimePanel" class="query-head">
        <span class="time-label time-label-start">开始时间</span>
        <button type="button" id="startTimeDisplay" class="time-display is-empty">未设置</button>
        <div class="preset-row">
          <button type="button" id="btnRange15Min">最近15分钟</button>
          <button type="button" id="btnRange1H">最近1小时</button>
          <button type="button" id="btnRange8H">最近8小时</button>
          <button type="button" id="btnRangeToday">今天</button>
          <button type="button" id="btnRangeYesterday">昨天</button>
          <button type="button" id="btnRange1W">最近1周</button>
        </div>
        <span class="time-label time-label-end">结束时间</span>
        <button type="button" id="endTimeDisplay" class="time-display is-empty">未设置</button>
        <div class="filter-row">
          <label for="queryCondition">筛选</label>
          <select id="queryCondition"><option value="">不附加</option></select>
          <label for="queryConditionValue">内容</label>
          <select id="queryConditionValue" disabled><option value="">请选择</option></select>
          <button type="button" id="btnGo">查询</button>
        </div>
        <span class="export-slot" aria-hidden="true"></span>
        <div class="touch-time-anchor">
          <input id="startDate" class="touch-time-value-input" type="hidden" />
          <input id="endDate" class="touch-time-value-input" type="hidden" />
          <span id="pluginTimeSummary" class="meta touch-time-inline-summary is-empty" aria-live="polite">尚未设置时间范围</span>
          <button type="button" id="btnPreciseTime">精确时间</button>
          <select id="tableSelector" hidden></select>
        </div>
      </div>
    </div>
    <div class="tableWrap">
      <table id="resultTable"></table>
    </div>
    <div class="pager">
      <button id="btnPrevPage">上一页</button>
      <button id="btnNextPage">下一页</button>
      <span class="pageText">第</span><input id="pageNumber" class="pageInput" type="number" min="1" value="1" readonly />
      <span class="pageText">/ <strong id="totalPageCount" class="pageTotal">—</strong> 页</span>
      <span id="recordSummary" class="pageText recordSummary" aria-live="polite">总数统计中</span>
      <div id="meta" class="meta"></div>
    </div>
  </div>
  <script src="/static/touch_time_range.js?v=20260727_02"></script>
  <script src="/static/specialized_query.js?v=20261028_01"></script>
</body>
</html>
