<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>查询页 — SD SMA Query Web</title>
    <link rel="stylesheet" href="/common/base.css?v=20261020_03" />
    <link rel="stylesheet" href="/static/styles.css?v=20261020_03" />
    <link rel="stylesheet" href="/static/touch_time_range.css?v=20260727_02" />
  </head>
  <body class="query-page">
    <nav class="page-nav" data-i18n-aria="nav.aria" aria-label="站内导航">
      <span class="page-nav-current" data-i18n="nav.current.query">查询页</span>
      <span class="page-nav-sep" aria-hidden="true">·</span>
      <a href="/config" data-i18n="nav.link.config">配置页</a>
    </nav>
    <div class="layout layout-stack">
      <section class="panel">
        <h2 data-i18n="query.conditions.title">查询条件</h2>
        <p class="hint" data-i18n="query.conditions.hint">时间范围可留空，留空时查询全部匹配记录，单页条数仍有上限。可再选一条附加条件，取值来自该条件配置的来源表。</p>
        <div class="row query-primary-row">
          <label for="viewName">View</label>
          <select id="viewName"></select>
          <label for="group">Group</label>
          <select id="group"></select>
          <label for="tableName" data-i18n="query.label.table">表选择</label>
          <select id="tableName"></select>
          <label for="labelLang" data-i18n="query.label.lang">列名显示</label>
          <select id="labelLang">
            <option value="zh" data-i18n="query.lang.zh">中文</option>
            <option value="en" data-i18n="query.lang.en">English</option>
            <option value="both" data-i18n="query.lang.both">中文 + English</option>
          </select>
          <label for="pageSize">PageSize</label>
          <input id="pageSize" class="field-narrow-num" type="number" value="10" min="1" max="500" />
          <button type="button" id="btnRefreshGroups" data-i18n="query.btn.refreshGroups">刷新组</button>
          <button type="button" id="btnRunQuery" data-i18n="query.btn.run">查询</button>
        </div>
        <div id="viewSummary" class="muted"></div>
        <div class="row query-pager">
          <button type="button" id="btnPrevPage" data-i18n="query.btn.prev">上一页</button>
          <button type="button" id="btnNextPage" data-i18n="query.btn.next">下一页</button>
          <span class="inline-label" data-i18n="query.page.prefix">第</span>
          <input id="pageNumber" class="field-page-num" type="number" value="1" min="1" readonly data-i18n-aria="query.page.aria" aria-label="当前页码" />
          <span class="inline-label" data-i18n="query.page.suffix">页</span>
          <span id="pageInfo" class="muted"></span>
        </div>
        <div id="schemaHint" class="muted"></div>
        <div class="row query-filter-row">
          <label for="queryCondition" data-i18n="query.label.condition">附加条件</label>
          <select id="queryCondition">
            <option value="" data-i18n="query.condition.none">不附加</option>
          </select>
          <label for="queryConditionValue" data-i18n="query.label.conditionValue">条件值</label>
          <select id="queryConditionValue" disabled>
            <option value="" data-i18n="query.condition.valuePlaceholder">请选择</option>
          </select>
        </div>
        <div id="queryTimePanel" class="row query-filter-row">
          <span class="inline-label" data-i18n="query.label.timeRange">时间范围</span>
          <input id="startTime" class="touch-time-value-input" type="hidden" />
          <input id="endTime" class="touch-time-value-input" type="hidden" />
          <span id="queryTimeSummary" class="muted touch-time-inline-summary is-empty" aria-live="polite" data-i18n="query.time.empty">尚未设置时间范围</span>
          <button type="button" id="btnRange15Min" data-i18n="query.range.15m">最近15分钟</button>
          <button type="button" id="btnRange1H" data-i18n="query.range.1h">最近1小时</button>
          <button type="button" id="btnRange8H" data-i18n="query.range.8h">最近8小时</button>
          <button type="button" id="btnRangeToday" data-i18n="query.range.today">今天</button>
          <button type="button" id="btnRangeYesterday" data-i18n="query.range.yesterday">昨天</button>
          <button type="button" id="btnRange1W" data-i18n="query.range.1w">最近1周</button>
          <button type="button" id="btnRange1M" data-i18n="query.range.1m">最近1月</button>
          <button type="button" id="btnPreciseTime" data-i18n="query.range.precise">精确时间</button>
        </div>
        <div id="querySummary" class="muted"></div>
        <div id="queryWarnings" class="muted warn" role="status" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2 data-i18n="query.result.title">查询结果</h2>
        <div class="query-table-wrap" tabindex="0" data-i18n-aria="query.result.aria" aria-label="查询结果，可横向滚动">
          <table id="resultTable"></table>
        </div>
      </section>
    </div>
    <script src="/common/zh.js?v=20261020_03"></script>
    <script src="/common/i18n.js?v=20261020_03"></script>
    <script src="/static/touch_time_range.js?v=20260727_02"></script>
    <script src="/static/query.js?v=20261026_01"></script>
  </body>
</html>
